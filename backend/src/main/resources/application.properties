spring.application.name=claimlens

# Auto-load local secrets from backend/.env (gitignored). `optional:` so deployed environments that
# inject real env vars boot fine without the file — and so tests without a .env are unaffected.
# This means `./mvnw spring-boot:run` and the IDE Run button both work with no manual env loading.
spring.config.import=optional:file:./.env[.properties]

# =========================
# Database
# =========================
# Secrets come from the environment (see backend/.env.example). No committed passwords.
# DATABASE_PASSWORD has no default on purpose: fail fast rather than boot on a stale secret.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/claimlens_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

# --- Connection pool (HikariCP — Spring Boot's default pool) ---
# Explicit so it's tuned for a managed Postgres (Neon) rather than left to Hikari's defaults.
# Neon's free tier caps direct connections, so keep the pool small; one Render instance x 10 is safe.
spring.datasource.hikari.pool-name=claimlens-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
# SQL logging off by default — the processing scheduler polls the job queues every few seconds, so
# show-sql floods the console. Set SHOW_SQL=true to see queries when debugging.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# =========================
# Cache (Spring cache abstraction)
# =========================
# Default (local dev): Caffeine, in-process. Upstash lives in the cloud, so hitting it from a local
# dev process would cost more than the single indexed query it saves. The 'prod' profile
# (application-prod.properties) switches this to Redis. @Cacheable code never names a provider.
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
# The Redis starter is on the classpath for the prod profile. Off-prod, stop Boot auto-configuring a
# Lettuce factory that would point at localhost:6379 and drag /actuator/health to DOWN.
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
# Turn the silent "single underscore" skip into a startup failure (see V4 history).
spring.flyway.validate-migration-naming=true

# =========================
# Security / JWT
# =========================
# JWT_SECRET has no default on purpose (fail fast). Must be >= 32 bytes for HS256.
claimlens.security.jwt.secret=${JWT_SECRET}
claimlens.security.jwt.access-token-ttl=${JWT_EXPIRATION:PT15M}
claimlens.security.jwt.refresh-token-ttl=${JWT_REFRESH_EXPIRATION:P7D}

# Google sign-in: the OAuth client id an incoming Google ID token must be issued for (aud claim).
# Blank disables Google login.
claimlens.auth.google.client-id=${GOOGLE_CLIENT_ID:}

# =========================
# Server
# =========================
# PORT is injected by the host (Render/Fly/etc.); default to 8080 locally.
server.port=${PORT:8080}

claimlens.api.base-path=/api/v1

# Seed a demo tenant (one user per role + sample data) on startup. SANDBOX ONLY.
claimlens.demo.seed=${DEMO_SEED:false}

# =========================
# OCR service integration
# =========================
# Off by default -> NoOpOcrClient (pipeline runs, no text extracted). Set OCR_ENABLED=true to call the
# Python OCR service at OCR_SERVICE_URL. shared-secret must match the service's OCR_SHARED_SECRET if set.
claimlens.ocr.enabled=${OCR_ENABLED:false}
# Which engine when enabled: 'http' (default, calls the Python ocr-service) or 'vision' (Google
# Cloud Vision REST, in-process, needs GOOGLE_VISION_API_KEY).
claimlens.ocr.provider=${OCR_PROVIDER:http}
claimlens.ocr.service-url=${OCR_SERVICE_URL:http://localhost:8000}
claimlens.ocr.shared-secret=${OCR_SHARED_SECRET:}
claimlens.ocr.vision.base-url=${VISION_BASE_URL:https://vision.googleapis.com/v1}
claimlens.ocr.vision.api-key=${GOOGLE_VISION_API_KEY:}

# Background poller that drains OCR/analysis/fraud queues (on in the running app; off in tests).
claimlens.processing.scheduler.enabled=${PROCESSING_SCHEDULER_ENABLED:true}
claimlens.processing.scheduler.interval-ms=${PROCESSING_SCHEDULER_INTERVAL_MS:3000}

# Analysis service (image fraud signals). Off by default -> NoOpAnalysisClient.
claimlens.analysis.enabled=${ANALYSIS_ENABLED:false}
claimlens.analysis.service-url=${ANALYSIS_SERVICE_URL:http://localhost:8001}
claimlens.analysis.shared-secret=${ANALYSIS_SHARED_SECRET:}

# =========================
# AI / RAG (policy intelligence)
# =========================
# Off by default -> stub feature-hash embeddings + extractive answers (no API key, works offline).
# Set AI_ENABLED=true + GEMINI_API_KEY for semantic embeddings and synthesised answers.
claimlens.ai.enabled=${AI_ENABLED:false}
claimlens.ai.gemini.api-key=${GEMINI_API_KEY:}
claimlens.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
claimlens.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
claimlens.ai.gemini.embedding-dimension=${GEMINI_EMBEDDING_DIMENSION:768}
claimlens.ai.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3-flash-preview}
# RAG retrieval: false -> in-Java cosine over JSON-text embeddings (any Postgres, default);
# true -> pgvector vector(768) + HNSW (needs the pgvector extension, e.g. Neon). Requires 768-dim
# embeddings (Gemini), so enable together with AI_ENABLED=true.
claimlens.ai.pgvector.enabled=${PGVECTOR_ENABLED:false}

# CORS: browser origins allowed to call the API (the frontend). Comma-separated.
claimlens.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# =========================
# Object storage
# =========================
# provider = local (filesystem, default) | s3 (S3-compatible, e.g. Cloudflare R2). The S3 impl is
# selected when provider=s3; secrets come from the environment (see backend/.env).
claimlens.storage.provider=${STORAGE_PROVIDER:local}
claimlens.storage.local-dir=${STORAGE_LOCAL_DIR:${java.io.tmpdir}/claimlens-documents}
claimlens.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
claimlens.storage.s3.region=${STORAGE_S3_REGION:auto}
claimlens.storage.s3.bucket=${STORAGE_S3_BUCKET:}
claimlens.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
claimlens.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
claimlens.storage.s3.public-base-url=${STORAGE_S3_PUBLIC_URL:}

# Email — swappable sender. 'log' (default) writes to the app log; 'resend' uses the Resend HTTP
# API; 'smtp' uses spring.mail.* below.
claimlens.email.provider=${EMAIL_PROVIDER:log}
claimlens.email.from=${EMAIL_FROM:Claimlens <noreply@mail.yogeshchauhan.dev>}
# Rich claim emails: branded HTML body + an attached "Claim Report" PDF (with stats, the
# investigator/approver, and the uploaded images). Off falls back to a plain-text email.
claimlens.email.rich.enabled=${EMAIL_RICH_ENABLED:true}
# Resend (provider=resend). API key is a secret — set RESEND_API_KEY in .env, never here.
claimlens.email.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
claimlens.email.resend.api-key=${RESEND_API_KEY:}
# SMTP (provider=smtp).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}