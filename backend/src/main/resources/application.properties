spring.application.name=claimlens


# =========================
# Database
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/claimlens_db
spring.datasource.username=postgres
spring.datasource.password=Yogesh@dev

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Flyway
# =========================
spring.flyway.enabled=true

# =========================
# Server
# =========================
server.port=8080

claimlens.api.base-path=/api/v1