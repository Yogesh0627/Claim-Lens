# =============================================================================
# prod profile — Redis (Upstash) replaces Caffeine as the cache backend.
# Everything else is inherited from application.properties.
# Activate on the deploy host with: SPRING_PROFILES_ACTIVE=prod
#
# ClaimLens shares ONE Upstash Redis account with EcoExpress. Keys are namespaced
# with the "claimlens:" prefix (see CacheConfig) so the two apps never collide.
# =============================================================================

spring.cache.type=redis

# Redis is the real cache in prod, so its health matters here (disabled in local dev).
management.health.redis.enabled=true

# --- Upstash connection (set REDIS_* on the deploy host) ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
# Upstash accepts its token as the RESP password (AUTH). No separate password needed.
spring.data.redis.password=${REDIS_PASSWORD}
# Upstash is TLS-only — without this the connection is refused.
spring.data.redis.ssl.enabled=true
# Cloud round trip: fail fast rather than hang a request thread. A cache slow to fail
# is worse than no cache.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.pool.enabled=true
