# Integration-test profile. Runs against a local Postgres `claimlens_test` DB.
# (Testcontainers is the intended CI path once Docker is available; local Postgres is used
#  for now because Docker is not installed on this machine.)

spring.datasource.url=jdbc:postgresql://localhost:5432/claimlens_test
spring.datasource.username=postgres
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Tests drive real endpoints; keep the persistence session request-scoped (no long-held connection).
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

# Fixed test secret (>= 32 bytes for HS256). Not a real credential.
claimlens.security.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-0000
claimlens.security.jwt.access-token-ttl=PT15M
claimlens.security.jwt.refresh-token-ttl=P7D

claimlens.api.base-path=/api/v1

# Tests drive the pipeline synchronously (drivePipeline) — keep the background poller off so it
# doesn't race the explicit OCR/analysis/fraud steps.
claimlens.processing.scheduler.enabled=false

# The base config auto-imports backend/.env on dev machines. Pin every integration OFF here so tests
# stay deterministic (stub embeddings/chat, no OCR, no image analysis, log-only email) regardless of
# whatever a local .env enables. These win because profile-specific properties override the base.
claimlens.ai.enabled=false
claimlens.ai.pgvector.enabled=false
claimlens.ocr.enabled=false
claimlens.analysis.enabled=false
claimlens.email.provider=log
# Keep the email path plain-text in tests — no HTML/PDF rendering on the claim flow.
claimlens.email.rich.enabled=false

# Rate limiting off by default so suites that log in repeatedly aren't throttled.
# RateLimitIntegrationTest re-enables it with a tiny limit via @TestPropertySource.
claimlens.security.rate-limit.enabled=false

# Caching off in tests. @Cacheable becomes a no-op, so RbacIntegrationTest's simulated
# permission revocation (a direct role_permission delete) is seen on the very next request —
# it tests the live D11 guarantee, not a cached copy.
spring.cache.type=none
