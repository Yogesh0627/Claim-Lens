# ==========================================================================================
# Render Blueprint — deploys the ClaimLens backend + image-analysis service.
# Spec: https://render.com/docs/blueprint-spec
#
# HOW TO USE:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → connect the repo. Render reads this file and
#      creates both services.
#   3. Fill in the secrets it prompts for (every env var marked `sync: false` below).
#   4. After the analysis service is live, set ANALYSIS_SERVICE_URL on the backend to its URL,
#      and after Vercel is live, set CORS_ALLOWED_ORIGINS to your Vercel domain. Redeploy.
#
# The database is EXTERNAL (Neon) — DATABASE_URL points at it (sync: false). Frontend is on Vercel.
# `region: singapore` co-locates with a Neon ap-southeast-1 project — change if your DB is elsewhere.
# ==========================================================================================

services:
  # ------------------------------------------------------------------ Backend (Spring Boot)
  - type: web
    name: claimlens-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # --- Database (external: Neon — use the DIRECT endpoint, not -pooler) ---
      - key: DATABASE_URL
        sync: false          # jdbc:postgresql://ep-xxxx.<region>.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random value

      # --- Cache / Redis (Upstash) ---
      # `prod` swaps the in-process Caffeine cache for Redis (application-prod.properties).
      # Keys are namespaced "claimlens:" — safe to share one Upstash account with other apps.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: REDIS_HOST
        sync: false          # e.g. your-db-12345.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false          # Upstash password / token

      # --- Rate limiting on /auth/** (brute-force protection) ---
      # Backed by Redis under the prod profile, so the limit holds across instances.
      # Fails open: if Redis is unreachable, requests are allowed rather than blocked.
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "20"          # per client IP, per auth endpoint, per window
      - key: RATE_LIMIT_WINDOW
        value: PT1M

      # --- CORS: set to your Vercel URL after the frontend deploys ---
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app

      # Public URL of the FRONTEND. Invitation and password-reset emails build their
      # "set your password" links from this — leave it unset and every emailed link points at
      # localhost and is useless to the recipient.
      - key: APP_BASE_URL
        sync: false          # e.g. https://your-app.vercel.app

      # --- Demo data (seeds a demo tenant + one login per role, idempotent) ---
      - key: DEMO_SEED
        value: "true"

      # --- Object storage: Cloudflare R2 (S3-compatible) ---
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_S3_ENDPOINT
        sync: false          # https://<account>.r2.cloudflarestorage.com
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      # Public R2 URL. Claim emails link photo thumbnails from here; leave it blank and the
      # thumbnails silently vanish from the email (the attached PDF still embeds them, so the
      # failure is invisible).
      - key: STORAGE_S3_PUBLIC_URL
        sync: false          # https://pub-<hash>.r2.dev

      # --- Email: Resend HTTP API ---
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false          # Claimlens <noreply@your-verified-domain>

      # --- OCR: Google Cloud Vision (in-JVM, no separate service) ---
      - key: OCR_ENABLED
        value: "true"
      - key: OCR_PROVIDER
        value: vision
      - key: GOOGLE_VISION_API_KEY
        sync: false          # project must have billing enabled

      # --- AI / RAG: Gemini (falls back to an offline answer if unavailable) ---
      - key: AI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      # pgvector + HNSW for RAG retrieval. ON here because Neon ships the `vector` extension;
      # local Postgres doesn't, so backend/.env keeps this false — that split is the whole point
      # of the flag. PgVectorInitializer creates the extension, column and index on boot.
      # Requires 768-dim embeddings, i.e. AI_ENABLED=true (the offline fallback is 768 too; the
      # AI_ENABLED=false stub is 256 and would NOT fit vector(768)).
      # NOTE: it does not backfill. Chunks ingested while this was off have a NULL embedding_vec
      # and are invisible to search — ingest policy documents AFTER this is on, or re-ingest.
      - key: PGVECTOR_ENABLED
        value: "true"

      # --- Image forensics (the analysis service below) ---
      - key: ANALYSIS_ENABLED
        value: "true"
      - key: ANALYSIS_SERVICE_URL
        sync: false          # https://claimlens-analysis.onrender.com  (set after it deploys)
      # Pulled from the analysis service's generated value, so both sides always agree and the
      # analysis service is never left open.
      - key: ANALYSIS_SHARED_SECRET
        fromService:
          type: web
          name: claimlens-analysis
          envVarKey: ANALYSIS_SHARED_SECRET

      # --- Google sign-in (optional) ---
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ------------------------------------------------------------- Analysis service (FastAPI)
  - type: web
    name: claimlens-analysis
    runtime: docker
    dockerfilePath: ./analysis-service/Dockerfile
    dockerContext: ./analysis-service
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Generated automatically and shared with the backend via `fromService` below, so this
      # service is NEVER deployed unauthenticated. It has a public URL on Render, and its auth
      # check is a no-op when the secret is blank — leaving it unset would let anyone POST images
      # and burn the free tier's CPU.
      - key: ANALYSIS_SHARED_SECRET
        generateValue: true
